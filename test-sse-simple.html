<!DOCTYPE html>
<html>
<head>
    <title>Simple SSE Test</title>
</head>
<body>
    <h1>Simple SSE Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    
    <script>
        const status = document.getElementById('status');
        const messages = document.getElementById('messages');
        
        console.log('Starting SSE test...');
        
        // Test the simple SSE endpoint first
        const testSSE = new EventSource('/api/test-sse');
        
        testSSE.onopen = () => {
            console.log('✅ Test SSE connected');
            status.textContent = 'Test SSE Connected';
            status.style.color = 'green';
        };
        
        testSSE.onmessage = (event) => {
            console.log('📨 Test SSE message:', event.data);
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${event.data}`;
            messages.appendChild(div);
        };
        
        testSSE.onerror = (error) => {
            console.error('❌ Test SSE error:', error);
            status.textContent = 'Test SSE Error';
            status.style.color = 'red';
        };
        
        // After 5 seconds, test the CTI endpoint
        setTimeout(() => {
            console.log('Testing CTI SSE endpoint...');
            status.textContent = 'Testing CTI SSE...';
            
            const ctiSSE = new EventSource('/api/cti-stomp-stream?token=test&userAddress=512');
            
            ctiSSE.onopen = () => {
                console.log('✅ CTI SSE connected');
                status.textContent = 'CTI SSE Connected';
                status.style.color = 'green';
            };
            
            ctiSSE.onmessage = (event) => {
                console.log('📨 CTI SSE message:', event.data);
                const div = document.createElement('div');
                div.textContent = `[CTI] [${new Date().toLocaleTimeString()}] ${event.data}`;
                div.style.color = 'blue';
                messages.appendChild(div);
            };
            
            ctiSSE.onerror = (error) => {
                console.error('❌ CTI SSE error:', error);
                status.textContent = 'CTI SSE Error';
                status.style.color = 'red';
            };
        }, 5000);
    </script>
</body>
</html>
