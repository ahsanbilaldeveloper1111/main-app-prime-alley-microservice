name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - stage
      branch:
        description: "Optional: override branch deployed on server"
        required: false
        type: string
      stage_run_npm:
        description: "Stage only: run npm install/ci (0 or 1)"
        required: false
        type: choice
        options:
          - "0"
          - "1"
        default: "0"
      reload_nginx:
        description: "Run `nginx -t && systemctl reload nginx` after deploy (0 or 1)"
        required: false
        type: choice
        options:
          - "0"
          - "1"
        default: "1"
  push:
    branches:
      - develop
      - main

# The deploy host is expected to have:
#   * nginx (config installed from deploy/nginx/mainapp.conf — see deploy/README.md)
#   * a systemd unit named `${STREAMING_SERVICE_NAME}` running the sidecar
#     (deploy/systemd/mainapp-streaming.service). Default name: mainapp-streaming.
# Override either name via repo/environment secrets:
#   DEV_STREAMING_SERVICE_NAME, STAGE_STREAMING_SERVICE_NAME

jobs:
  deploy-dev:
    name: Deploy to Dev (self-hosted)
    runs-on: [self-hosted, mainapp, dev]
    if: |
      github.ref_name == 'develop' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')

    env:
      APP_DIR: ${{ secrets.DEV_APP_DIR }}
      DOTENV_CONTENT: ${{ secrets.DEV_DOTENV }}
      STREAMING_SERVICE_NAME: ${{ secrets.DEV_STREAMING_SERVICE_NAME }}
      DEFAULT_BRANCH: ${{ secrets.DEV_BRANCH }}
      BRANCH_OVERRIDE: ${{ github.event.inputs.branch }}
      RELOAD_NGINX: ${{ github.event.inputs.reload_nginx || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Dev
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${APP_DIR:?DEV_APP_DIR secret is required}"
          STREAMING_SERVICE_NAME="${STREAMING_SERVICE_NAME:-mainapp-streaming}"
          BRANCH="${DEFAULT_BRANCH:-develop}"
          RELOAD_NGINX="${RELOAD_NGINX:-0}"

          if [ -n "${BRANCH_OVERRIDE}" ]; then
            BRANCH="${BRANCH_OVERRIDE}"
          fi

          echo "Deploying mainapp [dev] → $APP_DIR (branch=$BRANCH, streaming=$STREAMING_SERVICE_NAME)"

          cd "$APP_DIR"

          echo "→ Fetching code"
          git fetch origin
          git checkout "$BRANCH"
          git pull origin "$BRANCH"

          echo "→ Writing .env.local"
          # Both Vite (build time) and the streaming sidecar (runtime) read
          # from .env.local first, then .env. Keep secrets here.
          printf "%b" "$DOTENV_CONTENT" > .env.local
          chmod 600 .env.local || true

          echo "→ Stopping streaming sidecar"
          sudo systemctl stop "$STREAMING_SERVICE_NAME" || true

          echo "→ Installing dependencies"
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

          echo "→ Building SPA (Vite)"
          npm run build

          echo "→ Verifying build output"
          test -f "$APP_DIR/dist/index.html" \
            || { echo "Build did not produce dist/index.html"; exit 1; }

          echo "→ Starting streaming sidecar"
          sudo systemctl start "$STREAMING_SERVICE_NAME"

          echo "→ Waiting for sidecar to come up"
          for i in {1..15}; do
            if curl -fsS --max-time 2 "http://127.0.0.1:${STREAMING_PORT:-3102}/healthz" >/dev/null; then
              echo "  sidecar healthy after ${i}s"
              break
            fi
            sleep 1
            if [[ $i -eq 15 ]]; then
              echo "Sidecar did not become healthy in 15s"
              sudo systemctl --no-pager status "$STREAMING_SERVICE_NAME" || true
              sudo journalctl -u "$STREAMING_SERVICE_NAME" -n 200 --no-pager || true
              exit 1
            fi
          done

          if [[ "$RELOAD_NGINX" = "1" ]]; then
            echo "→ Reloading nginx (config-only change)"
            sudo nginx -t
            sudo systemctl reload nginx
          fi

          echo "→ Service status"
          sudo systemctl --no-pager status "$STREAMING_SERVICE_NAME" || true

  deploy-stage:
    name: Deploy to Stage (self-hosted)
    runs-on: [self-hosted, mainapp, prod]
    if: |
      github.ref_name == 'main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'stage')

    env:
      APP_DIR: ${{ secrets.STAGE_APP_DIR }}
      DOTENV_CONTENT: ${{ secrets.STAGE_DOTENV }}
      STREAMING_SERVICE_NAME: ${{ secrets.STAGE_STREAMING_SERVICE_NAME }}
      DEFAULT_BRANCH: ${{ secrets.STAGE_BRANCH }}
      BRANCH_OVERRIDE: ${{ github.event.inputs.branch }}
      STAGE_RUN_NPM: ${{ github.event.inputs.stage_run_npm || '0' }}
      RELOAD_NGINX: ${{ github.event.inputs.reload_nginx || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Stage
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${APP_DIR:?STAGE_APP_DIR secret is required}"
          STREAMING_SERVICE_NAME="${STREAMING_SERVICE_NAME:-mainapp-streaming}"
          BRANCH="${DEFAULT_BRANCH:-main}"
          STAGE_RUN_NPM="${STAGE_RUN_NPM:-0}"
          RELOAD_NGINX="${RELOAD_NGINX:-0}"

          if [ -n "${BRANCH_OVERRIDE}" ]; then
            BRANCH="${BRANCH_OVERRIDE}"
          fi

          echo "Deploying mainapp [stage] → $APP_DIR (branch=$BRANCH, streaming=$STREAMING_SERVICE_NAME, STAGE_RUN_NPM=$STAGE_RUN_NPM)"

          cd "$APP_DIR"

          echo "→ Fetching code"
          git fetch origin
          git checkout "$BRANCH"
          git pull origin "$BRANCH"

          echo "→ Writing .env.local"
          printf "%b" "$DOTENV_CONTENT" > .env.local
          chmod 600 .env.local || true

          echo "→ Stopping streaming sidecar"
          sudo systemctl stop "$STREAMING_SERVICE_NAME" || true

          if [[ "$STAGE_RUN_NPM" = "1" ]]; then
            echo "→ Installing dependencies"
            if [[ -f package-lock.json ]]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi
          else
            echo "→ Skipping npm install (STAGE_RUN_NPM=0)"
          fi

          echo "→ Building SPA (Vite)"
          npm run build

          echo "→ Verifying build output"
          test -f "$APP_DIR/dist/index.html" \
            || { echo "Build did not produce dist/index.html"; exit 1; }

          echo "→ Starting streaming sidecar"
          sudo systemctl start "$STREAMING_SERVICE_NAME"

          echo "→ Waiting for sidecar to come up"
          for i in {1..15}; do
            if curl -fsS --max-time 2 "http://127.0.0.1:${STREAMING_PORT:-3102}/healthz" >/dev/null; then
              echo "  sidecar healthy after ${i}s"
              break
            fi
            sleep 1
            if [[ $i -eq 15 ]]; then
              echo "Sidecar did not become healthy in 15s"
              sudo systemctl --no-pager status "$STREAMING_SERVICE_NAME" || true
              sudo journalctl -u "$STREAMING_SERVICE_NAME" -n 200 --no-pager || true
              exit 1
            fi
          done

          if [[ "$RELOAD_NGINX" = "1" ]]; then
            echo "→ Reloading nginx (config-only change)"
            sudo nginx -t
            sudo systemctl reload nginx
          fi

          echo "→ Service status"
          sudo systemctl --no-pager status "$STREAMING_SERVICE_NAME" || true
