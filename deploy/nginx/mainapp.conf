# =============================================================================
# mainapp — staging nginx config (Vite SPA + streaming sidecar)
#
# Staging host layout:
#   /var/www/mainapp/
#     ├── dist/     (Vite build output)
#     └── public/   (static public assets, incl. maintenance.html)
#
# Routes:
#   /                  → static SPA (Vite build output in /var/www/mainapp/dist)
#   /streaming/*       → reverse-proxy to the Express streaming sidecar
#                        (server/index.js, default port 3102 — match
#                         STREAMING_PORT in your .env / .env.local)
#   /api/finesse-ws-stream → legacy long-lived stream path (proxied to sidecar)
#   /ws/*              → legacy WS passthrough (kept from the old Next config)
#
# The sidecar serves SSE and WebSocket endpoints (analysis, CTI STOMP, Finesse
# WS, notification stream). The proxy is configured for those workloads:
#   * proxy_buffering off   — SSE chunks must flow immediately
#   * long timeouts         — streams stay open for hours
#   * Upgrade/Connection    — WebSocket upgrades pass through cleanly
# =============================================================================

# Map needed for clean WebSocket upgrades. `Connection: upgrade` is only sent
# when the client actually requests an upgrade; otherwise we send `close`.
# Define this once at http{} scope (move to /etc/nginx/conf.d/upgrade-map.conf
# if you already declare $connection_upgrade elsewhere).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Streaming sidecar upstream. Keep on loopback so only nginx can reach it.
upstream mainapp_streaming {
    server 127.0.0.1:3102 fail_timeout=0;
    keepalive 32;
}

# Backend upstream (API + storage). This keeps frontend requests same-origin:
#   https://staging.primealley.com/api/*     -> backend /api/*
#   https://staging.primealley.com/storage/* -> backend /storage/*
#
# Update the server here to match your environment (same host as you’d put in
# VITE_BACKEND_URL / VITE_BACKEND_STORAGE_URL, but without the path suffix).
upstream mainapp_backend {
    server 192.168.30.150:3001 fail_timeout=0;
    keepalive 32;
}

server {
    listen 7480;
    server_name staging.primealley.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.primealley.com;

    ssl_certificate     /etc/nginx/ssl/staging_primealley_com.crt;
    ssl_certificate_key /etc/nginx/ssl/staging_primealley_com.key;

    # Large header buffers (big cookies/session) — kept from the old Next setup.
    large_client_header_buffers 16 128k;
    client_header_buffer_size 64k;
    client_max_body_size 50m;
    client_body_buffer_size 256k;

    # If the SPA build output isn't present (e.g. during a failed deploy),
    # serve a stable maintenance page from /var/www/mainapp/public.
    error_page 502 503 504 =503 /maintenance.html;

    # SPA static root. Update to wherever your CI drops the Vite `dist/`.
    root /var/www/mainapp/dist;
    index index.html;

    # Drop dotfiles and backup files
    location ~ /\.(?!well-known) { deny all; }
    location ~ ~$            { deny all; }

    # Sensible defaults
    server_tokens off;
    client_max_body_size 50m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # Tune as your CSP allows; the SPA is fine with this baseline.
    # add_header Content-Security-Policy "default-src 'self'; ..." always;

    # ---- Static assets ------------------------------------------------------
    # Vite emits hashed filenames under /assets/ — safe to cache aggressively.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files (favicon, manifest, sw.js, robots, etc.)
    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|otf|css|js|map|json|txt|webmanifest)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # ---- Legacy WS passthrough ----------------------------------------------
    location /ws/ {
        proxy_pass http://192.168.26.26:9000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Legacy long-lived stream path --------------------------------------
    # Old Next.js deployments served this at /api/finesse-ws-stream; keep the
    # public URL stable but forward into the new sidecar implementation.
    location ^~ /api/finesse-ws-stream {
        proxy_pass http://mainapp_streaming/finesse-ws-stream;
        proxy_http_version 1.1;

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        gzip                    off;
        proxy_set_header Accept-Encoding "";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep the connection open without forcing WS upgrade semantics.
        proxy_set_header Connection "";

        proxy_intercept_errors on;
    }

    # ---- Backend API + storage (same-origin) --------------------------------
    # Frontend calls `/api/*` and `/storage/*` on the same domain; nginx forwards
    # to the backend host. This mirrors the old Next deployment but without a
    # Node proxy layer.
    location ^~ /api/ {
        proxy_pass http://mainapp_backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_intercept_errors on;
    }

    location ^~ /storage/ {
        proxy_pass http://mainapp_backend/storage/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_intercept_errors on;
    }

    # ---- Streaming sidecar (SSE + WebSocket) --------------------------------
    # All four streaming endpoints live behind /streaming/ in the browser:
    #   /streaming/cti-stomp-stream
    #   /streaming/analysis-stream
    #   /streaming/finesse-ws-stream
    #   /streaming/notification-stream
    # The trailing slash on `proxy_pass` makes nginx strip `/streaming/`
    # before forwarding (the sidecar mounts handlers at the root).
    location ^~ /streaming/ {
        proxy_pass http://mainapp_streaming/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade pass-through (used by Finesse WS).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Critical for SSE: stream chunks straight through, no buffering,
        # no compression, no proxy cache.
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_cache              off;
        gzip                     off;
        proxy_set_header Accept-Encoding "";
        chunked_transfer_encoding on;

        # Intercept upstream errors to show the maintenance page.
        proxy_intercept_errors on;

        # Long-lived streams. Adjust if you have a stricter LB upstream.
        proxy_connect_timeout 30s;
        proxy_send_timeout    24h;
        proxy_read_timeout    24h;

        # Don't add CORS here — same-origin via this proxy is the whole point.
        # If the streaming sidecar has its own `cors()` middleware enabled,
        # leave it permissive but rely on this same-origin proxy in production.
    }

    # ---- SPA fallback -------------------------------------------------------
    # React Router handles client-side routing; any unknown URL must serve
    # index.html so the SPA can match it. Cache index.html only briefly so
    # users pick up new builds without a hard refresh.
    location / {
        # If /index.html doesn't exist (dist missing), surface maintenance
        # instead of a confusing 404.
        try_files $uri $uri/ /index.html =503;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
    }

    # -----------------------------
    # Maintenance page (internal)
    # -----------------------------
    location = /maintenance.html {
        root /var/www/mainapp/public;
        internal;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
    }

    # ---- Logs ---------------------------------------------------------------
    access_log /var/log/nginx/mainapp.access.log;
    error_log  /var/log/nginx/mainapp.error.log warn;
}
